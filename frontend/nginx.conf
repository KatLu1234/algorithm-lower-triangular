# nginx 설정 — TLS 종단(:443) + ACME 챌린지 + HTTPS 리다이렉트(:80) + SPA 서빙 + /api 백엔드 프록시
#
# 컨테이너 토폴로지 (docker-compose.yml):
#   client → :443 (이 nginx, TLS) ┬── / : 정적 SPA
#                                 └── /api/ : backend:8000 (FastAPI)
#   client → :80                  ┬── /.well-known/acme-challenge/ : webroot (Let's Encrypt)
#                                 └── 그 외 : 301 → https://
#
# 인증서 파일 (Let's Encrypt + certbot):
#   /etc/letsencrypt/live/kustimetable.duckdns.org/fullchain.pem
#   /etc/letsencrypt/live/kustimetable.duckdns.org/privkey.pem
#   ⚠️ 첫 부팅 전 init-letsencrypt.sh 로 (1) 더미 자체서명 발급 (2) 실 인증서 교체 필요.
#
# 도메인 변경 시:
#   - 본 파일의 server_name 두 곳
#   - init-letsencrypt.sh 의 DOMAINS 배열
#   세 곳을 함께 바꾼다.

# 버전·OS 정보 응답 헤더에서 숨김
server_tokens off;

# gzip — JSON 응답·JS/CSS 자산에 효과적. 이미지·이미 압축된 포맷은 제외.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# ──────────────────────────────────────────────────────────────────────────
# :80 — ACME http-01 챌린지 통과 + 그 외 HTTPS 리다이렉트
# ──────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kustimetable.duckdns.org;

    # Let's Encrypt(certbot)가 도메인 소유 검증을 위해 토큰 파일을 webroot 에
    # 둔다. 이 경로만 평문 HTTP 로 통과시키고, 나머지는 HTTPS 로 보낸다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 그 외 모든 요청 → HTTPS 영구 리다이렉트.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────────────────────────────────────
# :443 — TLS 종단. SPA + /api 프록시.
# ──────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name kustimetable.duckdns.org;

    # ── TLS ────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/kustimetable.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kustimetable.duckdns.org/privkey.pem;

    # 안전한 기본값 — Mozilla intermediate 프로파일에 가깝게.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:LE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — 도메인이 HTTPS 만 사용한다는 신호. preload 는 외부 등록 후에 추가.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 한글 응답(JSON·HTML) 정확 표시
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # 요청 본문 — 자연어 텍스트 + 후보 강의 직렬화 여유
    client_max_body_size 2m;

    # 공통 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 정적 자산 캐시 (해시된 vite 산출물) ────────────────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 캐시 금지 — 신규 번들 해시를 즉시 가리키도록
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # ── 백엔드 프록시 (먼저 매칭) ────────────────────────────────
    #   /api/v1/... 호출이 SPA 폴백(/index.html)으로 흘러가지 않도록
    #   location / 보다 위에 배치한다.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 백엔드가 TLS 여부를 알아야 cookie Secure 등 결정 가능
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM(Upstage Solar) 응답 — 정상 1~3초, 지연 시 여유
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 4xx/5xx 응답 본문(JSON {detail, code})을 그대로 클라이언트에 전달
        proxy_intercept_errors off;
    }

    # 외부 헬스체크 — backend /healthz 로 직접 전달
    location = /healthz {
        access_log off;
        proxy_pass http://backend:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    # ── SPA 폴백 — 모든 클라이언트 라우트는 index.html ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
