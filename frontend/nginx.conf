# nginx 설정 — 정적 SPA 서빙 + /api 백엔드 프록시 (HTTPS)
#
# 컨테이너 토폴로지 (docker-compose.yml):
#   client → :443 (HTTPS, 이 nginx) → / : 정적 SPA
#                                  → /api/ : backend:8000 (FastAPI)
#   client → :80  (HTTP)            → 301 → :443
#   client → :80 /.well-known/acme-challenge/ → certbot webroot (HTTP-01)
#
# 인증서: Let's Encrypt (certbot) — `/etc/letsencrypt/live/<domain>/{fullchain,privkey}.pem`
# 발급/갱신 절차는 README 참고. 인증서가 없으면 nginx가 시작 실패하므로,
# 처음 실행 시엔 발급을 먼저 수행해야 한다.
#
# 백엔드 라우팅 (app/main.py):
#   - /api/v1/* : 비즈니스 라우트
#   - /healthz  : 라이브니스
#   - /         : 루트 핑 (실 사용자는 SPA가 가리므로 별도 노출 불필요)

# 버전·OS 정보 응답 헤더에서 숨김
server_tokens off;

# gzip — JSON 응답·JS/CSS 자산에 효과적. 이미지·이미 압축된 포맷은 제외.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# ── HTTP (80) — ACME 챌린지만 응답하고 나머지는 HTTPS로 301 ──────
server {
    listen 80;
    listen [::]:80;
    server_name kustimetable.duckdns.org;

    # Let's Encrypt HTTP-01 챌린지 — certbot webroot 모드.
    # docker-compose가 ./certbot/www → /var/www/certbot 마운트.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 그 외 전부 HTTPS로 영구 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (443) — 본 서비스 ───────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kustimetable.duckdns.org;

    # ── SSL 인증서 (Let's Encrypt 표준 경로) ────────────────────────
    ssl_certificate     /etc/letsencrypt/live/kustimetable.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kustimetable.duckdns.org/privkey.pem;

    # ── SSL 보안 설정 (Mozilla intermediate, TLS 1.2+1.3) ───────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;   # ~40,000 sessions
    ssl_session_tickets off;

    # OCSP stapling — 인증서 폐기 응답을 nginx가 캐시해 핸드셰이크 빠르게
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HSTS — 한 번 HTTPS로 접속한 브라우저는 1년간 자동 HTTPS 강제.
    # max-age는 첫 도입 시 작게(예: 60s) 검증 후 점차 늘리는 것이 안전하나,
    # 단일 서비스라 바로 1년으로 박는다. preload는 신청 절차가 별도라 제외.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 한글 응답 (JSON·HTML) 정확 표시
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # 요청 본문 — 자연어 텍스트 + 후보 강의 직렬화 여유
    client_max_body_size 2m;

    # 공통 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 정적 자산 캐시 (해시된 vite 산출물) ────────────────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 캐시 금지 — 신규 번들 해시를 즉시 가리키도록
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # ── 백엔드 프록시 (먼저 매칭) ────────────────────────────────
    #   /api/v1/... 호출이 SPA 폴백(/index.html)으로 흘러가지 않도록
    #   location / 보다 위에 배치한다.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM(Upstage Solar) 응답 — 정상 1~3초, 지연 시 여유
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 4xx/5xx 응답 본문(JSON {detail, code})을 그대로 클라이언트에 전달
        proxy_intercept_errors off;
    }

    # 외부 헬스체크 — backend /healthz 로 직접 전달
    location = /healthz {
        access_log off;
        proxy_pass http://backend:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    # ── SPA 폴백 — 모든 클라이언트 라우트는 index.html ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
