# nginx 설정 — 정적 SPA 서빙 + /api 백엔드 프록시
#
# 컨테이너 토폴로지 (docker-compose.yml):
#   client → :8080 (이 nginx, host port) → / : 정적 SPA
#                                       → /api/ : backend:8000 (FastAPI)
#
# 백엔드 라우팅 (app/main.py):
#   - /api/v1/* : 비즈니스 라우트
#   - /healthz  : 라이브니스
#   - /         : 루트 핑 (실 사용자는 SPA가 가리므로 별도 노출 불필요)

# 버전·OS 정보 응답 헤더에서 숨김
server_tokens off;

# gzip — JSON 응답·JS/CSS 자산에 효과적. 이미지·이미 압축된 포맷은 제외.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

server {
    listen 80;
    server_name kustimetable.duckdns.org;

    # 한글 응답 (JSON·HTML) 정확 표시
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # 요청 본문 — 자연어 텍스트 + 후보 강의 직렬화 여유
    client_max_body_size 2m;

    # 공통 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 정적 자산 캐시 (해시된 vite 산출물) ────────────────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 캐시 금지 — 신규 번들 해시를 즉시 가리키도록
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # ── 백엔드 프록시 (먼저 매칭) ────────────────────────────────
    #   /api/v1/... 호출이 SPA 폴백(/index.html)으로 흘러가지 않도록
    #   location / 보다 위에 배치한다.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM(Upstage Solar) 응답 — 정상 1~3초, 지연 시 여유
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 4xx/5xx 응답 본문(JSON {detail, code})을 그대로 클라이언트에 전달
        proxy_intercept_errors off;
    }

    # 외부 헬스체크 — backend /healthz 로 직접 전달
    location = /healthz {
        access_log off;
        proxy_pass http://backend:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    # ── SPA 폴백 — 모든 클라이언트 라우트는 index.html ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
